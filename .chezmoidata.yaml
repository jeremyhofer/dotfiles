# Session-environment SSOT. Rendered by chezmoi into BOTH ~/.zshenv (as `export K=V`)
# and ~/.config/environment.d/ (as `K=V`) so each value is defined once and can't drift between the
# shell env and the systemd/GUI session env. Linux values; the macOS agent story fills its own
# (zshrc.darwin / launchd) when that node is provisioned. Ordered list so renders are deterministic.
session_env:
  - { name: SSH_AUTH_SOCK, value: "${XDG_RUNTIME_DIR}/ssh-agent.socket" }
  - { name: SSH_ASKPASS_REQUIRE, value: "never" }

# Pinned third-party SKILL externals. Stated once here and consumed by BOTH
# .chezmoiexternal.toml.tmpl (which builds the download) and the verifier script (which checks
# what actually landed). Only these four fields are hand-maintained: the archive root, the
# include glob and stripComponents are DERIVED, because each hand-copied positional number is a
# way for a version bump to desync and install something subtly wrong.
#
# `subtree` is the path INSIDE the upstream repo that holds SKILL.md. If upstream repackages,
# that is the field that changes -- and the verifier is what tells you, loudly, that it did.
skill_externals:
  - name: avoid-ai-writing
    repo: conorbronsdon/avoid-ai-writing
    version: "3.36.0"
    subtree: plugins/avoid-ai-writing/skills/avoid-ai-writing
