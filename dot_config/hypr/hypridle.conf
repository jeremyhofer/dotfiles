# hypridle — idle daemon for the uwsm-managed sway session. Replaces swayidle.
#
# WHY NOT swayidle (this is the whole reason this file exists):
#   `swayidle -w` waits for its command to EXIT before releasing the logind sleep
#   inhibitor. That contract only works with a locker that forks once the screen is
#   actually locked — swayidle(1) spells it out: "the -w option is used in swayidle,
#   and -f in swaylock". hyprlock has NO fork flag, so it does not exit until you
#   UNLOCK. Consequences, both observed:
#     1. The inhibitor was always held past InhibitDelayMaxSec, so logind suspended
#        anyway, mid-way through hyprlock claiming the fingerprint reader over D-Bus.
#        On resume that stale claim could not be re-taken ("Device was already
#        claimed" / "device was disconnected"), so fingerprint unlock was dead for
#        the first unlock after every suspend. The password still worked, because
#        that path is PAM and never held a claim.
#     2. swayidle(1) also warns the unfinished command "will continue running after
#        resuming from sleep" — so the pre-suspend hyprlock survived the wake, the
#        idle timer then fired, and a SECOND hyprlock stacked on top of it.
#   There is no swayidle configuration that fixes this; the synchronisation primitive
#   it needs does not exist in hyprlock. Hence a different daemon.
#
# THE DESIGN HERE: every lock path goes through `loginctl lock-session`, which emits
# the logind Lock signal. hypridle's lock_cmd is the SINGLE handler for that signal.
# One lock owner instead of two racing spawners — the idle timeout, the sleep hook and
# the $mod+Ctrl+l keybinding all funnel through the same place.
#
# NOTE: this pairs with InhibitDelayMaxSec in logind.conf.d. systemd's 5s default is
# sized for trivial handlers; a graphical locker that arms a fingerprint reader needs
# more headroom before the freeze.

general {
    # `pidof || start` is the idempotency guard: if a locker is already up, do not
    # start a second one. Cheap, and it is what makes a duplicate Lock signal a no-op.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock BEFORE sleep by asking logind to lock the session, rather than spawning the
    # locker directly. Routing through the signal is what keeps lock_cmd the only
    # thing that ever launches hyprlock.
    before_sleep_cmd = loginctl lock-session

    # Respect application idle inhibitors (video players, presentations).
    ignore_dbus_inhibit = false
}

# Idle lock at 30 minutes, matching the X/i3 session's `xset s 1800` so both sessions
# behave the same. Deliberately no DPMS/output-power listener here: the swayidle setup
# this replaces did not have one, and adding behaviour while fixing a bug makes the fix
# harder to evaluate. Add one later as its own change if wanted.
listener {
    timeout    = 1800
    on-timeout = loginctl lock-session
}
