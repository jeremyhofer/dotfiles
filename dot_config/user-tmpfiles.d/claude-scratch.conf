# Age Claude Code agent scratch out of /tmp. Applied by the per-user systemd-tmpfiles-clean.timer,
# made hourly by this repo's drop-in at ~/.config/systemd/user/systemd-tmpfiles-clean.timer.d/.
#
# Why: every sandboxed Claude Code session of a user shares /tmp/claude-<uid> as its $TMPDIR, and on
# systemd v258+ /tmp is a RAM tmpfs with a per-user quota. Agents' experiment copies fill it within
# a day, and the failure arrives as "Disk quota exceeded" (EDQUOT) or as test failures that look
# like code defects. The system-wide /tmp rule ages at days, which is too slow.
#
# Age counts creation and modification only (bmBM). Access time is excluded on purpose: listing a
# directory updates its atime, so any scan (du, find, a backup) would otherwise keep old scratch
# alive forever.
#
# /tmp/claude-%U     the shared default temp root of sessions started by hand.
# /tmp/c-*           per-launch temp roots, when a launcher sets CLAUDE_CODE_TMPDIR=/tmp/c-<...>.
# -home-* dirs       Claude Code's own per-session task output (named after the project path), left
#                    to the session that owns them.
e /tmp/claude-%U - - - bmBM:1d
x /tmp/claude-%U/-home-*
e /tmp/c-* - - - bmBM:1d
x /tmp/c-*/claude-%U/-home-*

# Files one agent session hands to another, which must outlive both sessions' temp roots: on disk,
# outside the RAM quota, created on first use and aged after a week without writes.
d %h/.local/state/fleet-exchange 0700 - - bmBM:7d
