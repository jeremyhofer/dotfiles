# worktrunk -- generic user settings (the public layer).
#
# This is NOT worktrunk's config file. worktrunk reads ~/.config/worktrunk/config.toml, which
# `wt-config-gen` GENERATES from this file, an optional private fragment, and the per-repo
# `worktrunk:` blocks in a mani manifest. Edit this file (in the dotfiles source) and re-run
# wt-config-gen; applying the dotfiles does that for you.
#
# RULES FOR THIS FILE, because the generator concatenates it with other sources:
#   * it is the ONLY source that may hold top-level keys;
#   * it holds no project entries and no host names -- those belong to the layers that know them;
#   * the only hooks it holds are generic ones that do nothing in a repository that has not opted in.
#     A hook table it shares with the private fragment ([pre-start], say) is MERGED by the
#     generator into one table, and a hook NAME defined by both is refused.
#
# ---------------------------------------------------------------------------
# The default worktree location: nested in a standard clone, a sibling in a bare container
# ---------------------------------------------------------------------------
# Two repo shapes need different paths, because {{ repo_path }} resolves differently in each, and
# the template tells them apart by the name it ends in:
#
#   STANDARD CLONE (an ordinary clone; the fleet's layout) -- repo_path is the repo root, so
#   worktrees nest inside it:
#       <repo>/.worktrees/<branch>
#
#   BARE CONTAINER (the older layout: a bare repository named .git + sibling worktrees) -- repo_path
#   is that bare directory, <container>/.git, so ".." is already the container and the worktree is
#   just the branch:
#       <container>/<branch>
#     A container made before the rename keeps its bare repository in <container>/.bare and does not
#     end in /.git; `fleet-repo check` reports it as old-layout. Any container declared in the
#     manifest gets this same sibling path from wt-config-gen, so an old-shape one is covered too.
#
# WHY NESTED RATHER THAN A SIBLING, FOR A STANDARD CLONE. The obvious alternative,
# {{ repo_path }}/../{{ repo }}.{{ branch }}, puts the worktree next to the repositories themselves,
# so anything that enumerates a directory of repositories (mani, for one) meets something
# repo-shaped that is not a repo. Nesting keeps that directory meaning one thing, makes a worktree
# die with the repository that owns it, and keeps it inside the one directory an agent session
# standing in the checkout may write, so a session's subagents can work in worktrees of their own.
#
# THE COST: a nested worktree lives inside a working tree, so `.worktrees/` must be ignored -- in
# each repository's own .gitignore, committed, so it holds on every machine and in every tool --
# and tools that walk the tree (prettier, eslint, rg, nx) must honour that ignore or carry their own.
worktree-path = "{% if repo_path is endingwith(\"/.git\") %}{{ repo_path }}/../{{ branch | sanitize }}{% else %}{{ repo_path }}/.worktrees/{{ branch | sanitize }}{% endif %}"

# Pin the JSON output schema. Without this, every `wt config show` prints a migration advisory
# warning that a future release changes the default.
[list]
json-schema = 2

# ---------------------------------------------------------------------------
# Files a new worktree needs that git does not carry
# ---------------------------------------------------------------------------
# A worktree is a fresh checkout, so gitignored, per-machine files -- Gradle's local.properties, a
# .env, local config -- are not in it. The standard (docs/reference/repository-layouts.md): those
# files live in the default branch's worktree, a repository lists them in an (untracked or committed)
# .worktreeinclude at that worktree's root, and every NEW worktree gets a copy.
#
# THE OPT-IN IS THE .worktreeinclude FILE, so this hook is global: without one it does nothing and
# prints nothing. --require-include keeps it that way -- without the flag worktrunk copies EVERY
# ignored file, build output and node_modules included. `step copy-ignored` copies from the primary
# worktree (the default branch's, in a bare container) and never overwrites a file already there.
#
# pre-start, not post-start: it BLOCKS, so the files are in place before any later hook (a dependency
# install) or the first build. worktrunk runs global pre-start hooks before per-project ones.
#
# Worktrees made by `fleet-repo` do not run worktrunk hooks; it runs the same copy itself.
[pre-start]
copy-files = "if [ -f {{ primary_worktree_path }}/.worktreeinclude ]; then wt step copy-ignored --require-include; fi"

# ---------------------------------------------------------------------------
# A new worktree starts from a freshly fetched base
# ---------------------------------------------------------------------------
# `wt switch --create` branches from the LOCAL base and never fetches, so a worktree can start far
# behind the remote. `wt-fetch-base` (its header has the design and the measurements behind it)
# fetches the base from origin, falling back to the remotes named by `git config fetch-base.fallback`,
# and refuses to create when none can be reached. It needs both hooks: pre-switch is the only one that
# runs before anything exists (so a refusal leaves nothing behind), and pre-start is the only one that
# knows the base (`base` is defined there exactly when --create made a new branch).
#
# THE OPT-IN IS `git config fetch-base.enabled true` (any scope), so these do nothing in a repository,
# or on a machine, that has not asked for it. Where the script is missing they do nothing either,
# unless the repository has opted in: then creation fails, rather than quietly using a stale base.
# Template variables are shell-escaped by worktrunk.
#
# ORDER, measured on worktrunk 0.79: the entries of one hook table run CONCURRENTLY, and a per-project
# table ([projects."..."], where wt-config-gen puts the dependency install) runs only after this
# global one has finished. So the install sees the fetched tree. Never put an install, or anything
# else that reads tracked files, in this global [pre-start] table: it would race the move to the
# fetched commit and could install from the stale lockfile (tests/test-wt-fetch-base.sh pins both).
# copy-files beside it is safe: it copies only ignored files and never overwrites one.
fetch-base = "{% if base is defined %}if command -v wt-fetch-base >/dev/null 2>&1; then wt-fetch-base pre-start {{ base }}; elif [ \"$(git config --bool fetch-base.enabled)\" = true ]; then echo 'fetch-base is enabled but wt-fetch-base is not installed' >&2; exit 1; fi{% endif %}"

[pre-switch]
fetch-base = "if command -v wt-fetch-base >/dev/null 2>&1; then wt-fetch-base pre-switch {{ branch }}; elif [ \"$(git config --bool fetch-base.enabled)\" = true ]; then echo 'fetch-base is enabled but wt-fetch-base is not installed' >&2; exit 1; fi"
