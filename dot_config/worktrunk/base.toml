# worktrunk -- generic user settings (the public layer).
#
# This is NOT worktrunk's config file. worktrunk reads ~/.config/worktrunk/config.toml, which
# `wt-config-gen` GENERATES from this file, an optional private fragment, and the per-repo
# `worktrunk:` blocks in a mani manifest. Edit this file (in the dotfiles source) and re-run
# wt-config-gen; applying the dotfiles does that for you.
#
# RULES FOR THIS FILE, because the generator concatenates it with other sources:
#   * it is the ONLY source that may hold top-level keys;
#   * it holds no project entries and no host names -- those belong to the layers that know them;
#   * the only hooks it holds are generic ones that do nothing in a repository that has not opted in.
#     A hook table it shares with the private fragment ([pre-start], say) is MERGED by the
#     generator into one table, and a hook NAME defined by both is refused.
#
# ---------------------------------------------------------------------------
# The default worktree location: a sibling in a bare container, nested in a plain clone
# ---------------------------------------------------------------------------
# Two repo shapes need different paths, because {{ repo_path }} resolves differently in each, and
# the template tells them apart by the name it ends in:
#
#   ORDINARY CHECKOUT -- repo_path is the repo root, so worktrees nest inside it:
#       <repo>/.worktrees/<branch>
#
#   BARE CONTAINER (a bare repository named .git + sibling worktrees) -- repo_path is that bare
#   directory, <container>/.git, so ".." is already the container and the worktree is just the branch:
#       <container>/<branch>
#     A container made before the rename keeps its bare repository in <container>/.bare and does not
#     end in /.git; `fleet-repo check` reports it as old-layout, and until it is converted it needs
#     `layout: bare` declared in the manifest, which wt-config-gen turns into this same sibling path
#     for that project. The declaration stays true in the new shape too; it is simply no longer the
#     only thing keeping an undeclared container's worktrees out of its own git directory.
#
# WHY NESTED RATHER THAN A SIBLING, FOR A PLAIN CLONE. The obvious alternative,
# {{ repo_path }}/../{{ repo }}.{{ branch }}, puts the worktree next to the repositories themselves,
# so anything that enumerates a directory of repositories (mani, for one) meets something
# repo-shaped that is not a repo. Nesting keeps that directory meaning one thing, and makes a
# worktree die with the repository that owns it.
#
# THE COST: a nested worktree lives inside a working tree, so `.worktrees/` must be ignored --
# globally, not per repo -- and tools that walk the tree (prettier, eslint, rg, nx) each need their
# own ignore entry. A repository that converts to a bare container stops having this problem.
worktree-path = "{% if repo_path is endingwith(\"/.git\") %}{{ repo_path }}/../{{ branch | sanitize }}{% else %}{{ repo_path }}/.worktrees/{{ branch | sanitize }}{% endif %}"

# Pin the JSON output schema. Without this, every `wt config show` prints a migration advisory
# warning that a future release changes the default.
[list]
json-schema = 2

# ---------------------------------------------------------------------------
# Files a new worktree needs that git does not carry
# ---------------------------------------------------------------------------
# A worktree is a fresh checkout, so gitignored, per-machine files -- Gradle's local.properties, a
# .env, local config -- are not in it. The standard (docs/reference/repository-layouts.md): those
# files live in the default branch's worktree, a repository lists them in an (untracked or committed)
# .worktreeinclude at that worktree's root, and every NEW worktree gets a copy.
#
# THE OPT-IN IS THE .worktreeinclude FILE, so this hook is global: without one it does nothing and
# prints nothing. --require-include keeps it that way -- without the flag worktrunk copies EVERY
# ignored file, build output and node_modules included. `step copy-ignored` copies from the primary
# worktree (the default branch's, in a bare container) and never overwrites a file already there.
#
# pre-start, not post-start: it BLOCKS, so the files are in place before any later hook (a dependency
# install) or the first build. worktrunk runs global pre-start hooks before per-project ones.
#
# Worktrees made by `fleet-repo` do not run worktrunk hooks; it runs the same copy itself.
[pre-start]
copy-files = "if [ -f {{ primary_worktree_path }}/.worktreeinclude ]; then wt step copy-ignored --require-include; fi"
