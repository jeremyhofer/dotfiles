# The stock per-user timer runs on OnUnitActiveSec=1d, a monotonic timer, and systemd.timer(5) says
# the monotonic clock generally pauses while the machine sleeps, so on a laptop "daily" can mean
# every few days. Replace it with a calendar schedule: calendar timers catch up after resume, and
# Persistent=true also catches up on time the machine was powered off.
[Timer]
OnUnitActiveSec=
OnCalendar=hourly
Persistent=true
