# The session-lifecycle suite: what keeps a background session's process running, and what lets it
# stop. Cases are added one at a time, each before the build step it bears on;
# `seam-probe list session-lifecycle` shows them.
suite = "session-lifecycle"
description = "what keeps a background session's process running, and what lets it stop"

[[case]]
id = "idle-holders"
question = "Claude Code's supervisor stops a background session that is finished or waiting for the next message and unattached for about an hour (its documentation's agent view, \"The supervisor process\", read 2026-11-11), and counts a running subagent, workflow or monitor, or a pending session-scoped scheduled task, as working. On 2.1.330 a background Bash command still running did not keep its session up past that stop, and one that had finished, its completion delivered as a new turn, did. Which keeps an idle, unattached background session's process running past the stop, against a control with nothing: (a) a background Bash command still running, (b) a one-shot CronCreate job that has fired, a turn with no task behind it, (c) a pending one-shot CronCreate job, (d) a background command that finished and whose completion was delivered?"
relies = "A running background command is not a holder: that session is stopped about the control's idle duration after its turn (within the tolerance, 15 min by default). A turn alone restarts the idle clock and holds nothing: a session whose one-shot job fired is stopped about the control's idle duration after that turn ends. A pending one-shot job holds a session at least the margin (30 min by default) past the control's stop. A delivered completion holds a session at least the margin past the control's idle duration after its completion turn, beyond what a turn alone does. Each later turn is read from its codeword in the transcript, and each process from the session's pid record and the daemon roster, never from the agents listing, whose rows carry no pid and can stay done or blocked after the process is gone."
bears-on = "how a keep-alive for a background session is built"
regimes = ["real"]
script = "idle-holders.sh"
helpers = ["idle-lib.sh"]
fixtures = ["idl"]
controls = ["control: a session with no holder must be seen to stop within the cap, or the idle stop was never observed and every arm is VOID", "each arm's holder is read from the session's transcript: a background Bash call with the exact command, or a one-shot CronCreate call for the expected minute, status ok; the control made none", "each later turn is read from its own codeword in the transcript (FIRED for the job's turn, RELEASED for the completion's), once a poll round; a FIRED seen before its job was due is INCONCLUSIVE", "an arm whose claim is a stop about the control's idle duration is FAIL only when seen present the margin past it, and INCONCLUSIVE when it stopped outside the tolerance but within the margin"]
# A plant reaches one arm, and the arm's verdict is the only thing it can turn: shell-held and
# schedule-dropped each change one holder (a pending job given to the shell arm, the schedule arm's
# job deleted), and completion-withheld keeps the release arm's command running, so no completion
# arrives. control-held gives the control a pending job, so every arm reads VOID. The turn arm has
# no plant of its own: the comparison with release is the finding.
plants = [
  { id = "shell-held", expect = "FAIL", arm = "shell" },
  { id = "schedule-dropped", expect = "FAIL", arm = "schedule" },
  { id = "completion-withheld", expect = "FAIL", arm = "release" },
  { id = "control-held", expect = "VOID" },
]
minutes = 125

# Each runs as its own Bash call, started in the background (`seam-probe prompt --background`).
# hold keeps running past the idle stop; release ends after the seconds it names, and its completion
# is delivered as a turn the case reads from the transcript. completion-withheld runs hold in
# release's place.
[case.commands]
hold = "sleep 9000"
release = "sleep 900"

[[case]]
id = "attached-stop"
question = "When a background session's process is stopped the way the fleet's refresh stops one (SIGTERM, then SIGKILL after 5 s, then `claude rm`), does Claude Code bring it back as a crash-respawn when the session is attached: (a) open in a terminal through `claude attach`, or (b) selected in the agent view (`claude agents`) with its peek panel open, against (c) a control that nothing is attached to? Claude Code documents no attached field (the `claude agents --json` rows carry only cwd, id, kind, name, sessionId, startedAt and state), so the instrument cannot see an attachment: a person makes each one and confirms it."
relies = "A stopped session stays stopped whether or not a client is attached to it: within the watch after the stop, no process for its session uuid is running again, its transcript has gained no line, and no row for it is listed under `claude agents --json --all` after the `claude rm`, as the unattached control is seen to stay stopped. An attachment is made and confirmed by the person at the terminal, never observed by the instrument, and each attached arm's verdict says so."
bears-on = "a session's request for its own refresh"
regimes = ["real"]
script = "attached-stop.sh"
fixtures = ["ats"]
controls = ["control: the same stop applied to a session nothing is attached to must leave it stopped (the fleet already relies on that), or a respawn cannot be laid to attachment and every arm is VOID", "each arm's stop is read from its pid record: `session term` refuses (INCONCLUSIVE) a session with no live pid record, and a process that survived SIGKILL", "each arm's watch reads three signs independently (process, transcript, listing); an arm whose sign could not be read at any poll is INCONCLUSIVE, never PASS"]
# A person is at the terminal for these two and for the two looks that follow the watches; under a
# plant they run all the same, since `red` is run from a terminal too.
manual = [
  "terminal arm: in another terminal run `claude attach <id>` (the case prints the id), leave it open and in view, and press Enter once it shows the session",
  "agentview arm: in another terminal run `claude agents`, select the session named <display name> (the case prints it) and open its peek panel, leave it open, and press Enter",
  "after each attached arm's watch: look at the attached terminal or agent view and press Enter (the instrument cannot read the client's own display)",
]
# A plant reaches one arm, and the arm's verdict is the only thing it can turn: respawn has the case
# itself resume the stopped terminal session with a flagless `claude --bg --resume`, which brings it
# back, so that arm must FAIL. control-respawn does the same to the control, so every arm is VOID.
plants = [
  { id = "respawn", expect = "FAIL", arm = "terminal" },
  { id = "control-respawn", expect = "VOID" },
]
minutes = 12

[[case]]
id = "completion-hold"
question = "On Claude Code 2.1.330 a background session whose background command finished, its completion delivered as a new turn, was still running 105 minutes after that turn, past the idle stop a session with nothing to hold it reached at about 61 (idle-holders). Is such a session stopped at all: within eight hours of launch, against a control with nothing?"
relies = "A session held only by a delivered completion is stopped within the cap (480 min by default). Still present at the cap is the leak: every session that ever ran a background command would never idle out. The completion turn is read from its codeword in the transcript, and the process from the session's pid record and the daemon roster, never from the agents listing."
bears-on = "how a keep-alive for a background session is built, and whether finished sessions leak"
regimes = ["real"]
script = "completion-hold.sh"
helpers = ["idle-lib.sh"]
fixtures = ["cph"]
controls = ["control: a session with no holder must be seen to stop within the cap, or the idle stop was never observed and every arm is VOID", "the release arm's command is read from its transcript (an ok background Bash call with the exact command), and its completion turn from its codeword (RELEASED); a session never seen to receive one is INCONCLUSIVE, never PASS or FAIL"]
# held-past-cap gives the release session a pending job past the cap, so it must FAIL; control-held
# gives the control the same job, so every arm reads VOID.
plants = [
  { id = "held-past-cap", expect = "FAIL", arm = "release" },
  { id = "control-held", expect = "VOID" },
]
minutes = 490

[case.commands]
release = "sleep 900"
