<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 656" width="1000" height="656" role="img" aria-labelledby="t d">
<title id="t">How the dotfiles reach a machine</title>
<desc id="d">Two chezmoi sources apply into one home directory. The public base, published on GitHub, supplies every mechanism: shell, editor, git, Claude Code configuration and command-line tools. A private layer, one per domain and never published, supplies identity, secrets, hosts and the domain's own context, through four seams: fragment files under ~/.dotlocal, chezmoi data, the repository manifest, and environment variables. System packages are installed first, underneath both. Checks run on every commit and on each machine.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs>
<rect width="1000" height="656" fill="#0d1117" rx="12"/>
<rect x="40" y="30" width="430" height="130" rx="10" fill="#0c2d6b" stroke="#4493f8" stroke-width="2"/>
<text x="62" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="start">Public base</text>
<text x="200" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#a7aeb7" text-anchor="start">this repository · on GitHub</text>
<text x="62" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#e6edf3" text-anchor="start">Every mechanism, for every machine:</text>
<text x="62" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#e6edf3" text-anchor="start">shell · editor · git · Claude Code · tools</text>
<text x="62" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="start">chezmoi apply</text>
<rect x="530" y="30" width="430" height="130" rx="10" fill="#3b2e0a" stroke="#d29922" stroke-width="2" stroke-dasharray="7 5"/>
<text x="552" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="start">Private layer</text>
<text x="700" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#a7aeb7" text-anchor="start">one per domain · never published</text>
<text x="552" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#e6edf3" text-anchor="start">Only what a domain owns:</text>
<text x="552" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#e6edf3" text-anchor="start">identity · secrets · hosts · its own context</text>
<text x="552" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="start">chezmoi-overlay apply</text>
<rect x="530" y="186" width="430" height="82" rx="8" fill="#0d1117" stroke="#d29922" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="552" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#a7aeb7" text-anchor="start">plugs in through four seams</text>
<text x="552" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#e6edf3" text-anchor="start">~/.dotlocal fragments · chezmoi data</text>
<text x="552" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#e6edf3" text-anchor="start">repository manifest · environment vars</text>
<line x1="255" y1="160" x2="255" y2="294" stroke="#6e7681" stroke-width="2" marker-end="url(#arrow)"/>
