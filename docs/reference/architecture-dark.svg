<text x="78" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#e6edf3" text-anchor="start">zsh · tmux · Neovim</text>
<text x="78" y="423" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#e6edf3" text-anchor="start">terminal · prompt</text>
