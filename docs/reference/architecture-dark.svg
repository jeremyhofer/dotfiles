<text x="265" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#a7aeb7" text-anchor="start">deploys</text>
<rect x="40" y="296" width="920" height="228" rx="10" fill="#161b22" stroke="#9198a1" stroke-width="2"/>
